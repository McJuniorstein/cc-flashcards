name: CI

# Verify the deck and run the verifier's own unit tests on every push to main
# and every pull request. Stdlib-only — no dependency install step needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests for verify.py
        run: python3 scripts/test_verify.py

      - name: Verify the card deck against sources
        run: python3 scripts/verify.py
